prefix: '<dark_purple>[ProjectE-JB]</dark_purple> '
errors:
  players-only: '<red>This command can only be used by an online player.</red>'
  no-permission: '<red>You do not have permission to do that.</red>'
  invalid-number: '<red>Enter a valid positive integer.</red>'
  invalid-material: '<red>Unknown item ID: <yellow>{material}</yellow></red>'
  no-emc-value: '<red>This item has no EMC value.</red>'
  unsafe-item: '<red>Only clean vanilla items without enchantments, names, damage, container contents, or custom data are accepted.</red>'
  empty-hand: '<red>Hold the item in your main hand first.</red>'
  nothing-to-sell: '<yellow>Your inventory contains no eligible clean vanilla items.</yellow>'
  nothing-to-learn: '<yellow>Your inventory contains no new eligible item to learn.</yellow>'
  already-learned: '<yellow>You already learned <white>{item}</white>.</yellow>'
  not-learned: '<red>You have not learned <white>{item}</white>.</red>'
  insufficient-emc: '<red>Not enough EMC. Required <yellow>{required}</yellow>, balance <yellow>{balance}</yellow>.</red>'
  inventory-full: '<red>Not enough inventory space. The purchase was cancelled without charging EMC.</red>'
  player-not-found: '<red>Player <yellow>{player}</yellow> was not found.</red>'
  cannot-pay-self: '<red>You cannot pay yourself.</red>'
  transfer-too-small: '<red>The minimum transfer is <yellow>{minimum}</yellow> EMC.</red>'
  database: '<red>The database operation failed and the transaction was safely rolled back.</red>'
  usage: '<red>Invalid arguments. Use <yellow>/projectejb help</yellow>.</red>'
  search-timeout: '<yellow>The search prompt timed out.</yellow>'

